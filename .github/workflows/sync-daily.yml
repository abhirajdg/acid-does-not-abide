name: Sync daily patterns from private pipeline repo

on:
  schedule:
    # 06:45 IST = 01:15 UTC daily — after the cloud step's 06:00 IST commit
    # to abhirajdg/bong-lebowski-music, with a buffer for it to land.
    - cron: "15 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up SSH access to the private repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}

      - name: Sparse-checkout daily/ from the private repo
        run: |
          git clone --filter=blob:none --no-checkout \
            git@github.com:abhirajdg/bong-lebowski-music.git private-src
          cd private-src
          git sparse-checkout set daily
          git checkout master

      - name: Copy new/changed daily patterns into this repo
        run: |
          mkdir -p daily
          cp private-src/daily/*.strudel daily/ 2>/dev/null || true
          cp private-src/daily/*.json daily/ 2>/dev/null || true
          rm -rf private-src

      - name: Commit and push if anything changed
        run: |
          git config user.name "bong-lebowski-daily-sync"
          git config user.email "noreply@bonglebowski.in"
          git add daily/
          if git diff --cached --quiet; then
            echo "No new daily patterns — nothing to sync."
            exit 0
          fi
          git commit -m "Sync daily patterns $(date -u +%Y-%m-%d)"
          git push
